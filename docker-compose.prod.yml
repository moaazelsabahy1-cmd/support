# Production overlay: Postgres and Qdrant listen on loopback only.
# Usage on the VPS:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Set POSTGRES_PASSWORD in the server .env (never commit it).

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"

  qdrant:
    ports:
      - "127.0.0.1:6333:6333"
