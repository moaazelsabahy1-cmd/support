services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: solvio
      POSTGRES_PASSWORD: solvio
      POSTGRES_DB: solvio
    ports:
      - "5433:5432"
    volumes:
      - solvio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solvio -d solvio"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - solvio_qdrant:/qdrant/storage

volumes:
  solvio_pg:
  solvio_qdrant:
